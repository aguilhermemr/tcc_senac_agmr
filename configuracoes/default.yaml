# Configuração default — Processo A (Seleção de Pessoal)
# Para rodar outro processo, use --bpmn <path> --output-dir <dir> ou copie este arquivo.

# -------- dados --------
bpmn_path: exemplos/process_A.bpmn
process_name: process_A
n_cases: 2000
seed: 42

# -------- env --------
max_steps: 200

# -------- recompensa multi-objetivo (TCC §4.4) --------
# Pesos calibrados via grid search inicial; alterar para refletir prioridades
# organizacionais específicas (mais agilidade → aumentar w_time, etc.)
w_time: 0.30
w_complexity: 0.30
w_quality: 0.30
w_success: 0.10

# -------- arquitetura GAT (TCC §4.3.2) --------
hidden_dim: 64
heads: 4
num_gat_layers: 3
features_dim: 128
dropout: 0.2

# -------- PPO (TCC §4.2.3.2) --------
# Valores iniciais conforme recomendações de Schulman et al. (2017) e
# convergência observada em CartPole na Sprint 2 (§6.2.1).
total_timesteps: 2000000
n_envs: 4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
learning_rate: 0.0003
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5

# -------- output / logging --------
output_dir: runs/process_A_seed42
mlflow_experiment: angelia-ppo-gat
use_wandb: false
wandb_project: angelia-ppo-gat

# -------- avaliação / checkpointing --------
eval_freq: 25000
n_eval_episodes: 20
checkpoint_freq: 100000
